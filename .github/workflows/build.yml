name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "无法从 build.gradle.kts 读取 versionName"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$VERSION"

      - name: 恢复正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "使用正式签名（timely）"
          else
            echo "未配置签名 Secrets，本次回退 debug 签名"
          fi

      - name: 跑单元测试
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          ls -1 app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "out/Timely-${{ steps.ver.outputs.version }}.apk"
          ls -lh out

      - name: 校验签名
        run: |
          APK="out/Timely-${{ steps.ver.outputs.version }}.apk"
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "使用 build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Timely-${{ steps.ver.outputs.version }}
          path: out/*.apk
          retention-days: 90

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Timely ${{ steps.ver.outputs.version }}
          body: |
            ## Timely（时予）v${{ steps.ver.outputs.version }}

            倒数日 / 正数日，记下你期待和纪念的每一天。

            ### 下载
            点下方 `Timely-${{ steps.ver.outputs.version }}.apk` 安装。

            ### 更新
            直接覆盖安装即可；如遇「签名不一致」，先卸载旧版再装。
          files: out/*.apk
