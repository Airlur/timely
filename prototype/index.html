<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时予 Timely · 原型 v0.2.0</title>
<style>
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --surface2:#F3F3F3; --surface3:#ECEEF0;
  --ink:#333333; --ink2:#757175; --line:#EEEEEE;
  --primary:#2196F3; --primaryDeep:#1976D2; --primarySoft:rgba(33,150,243,.12);
  --toastbg:#2B2F36; --toastink:#FFFFFF;
}
body[data-theme=dark]{
  --bg:#121212; --surface:#1E1E1E; --surface2:#171717; --surface3:#252525;
  --ink:#E0E0E0; --ink2:#9A9A9A; --line:#2A2A2A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#E7EBF1;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 12px}
.phone{width:390px;height:844px;border-radius:46px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 11px #14181F,0 0 0 13px #333B47,0 30px 70px rgba(15,25,45,.28);color:var(--ink);user-select:none}
.cap{font-size:12px;color:#8A94A6;letter-spacing:.4px;text-align:center;line-height:1.7}
.statusbar{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13.5px;font-weight:600;background:var(--surface)}
.sbicons{display:flex;gap:5px;align-items:center}
.app{position:absolute;top:46px;bottom:64px;left:0;right:0;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* ===== 底部导航 ===== */
.bottomnav{position:absolute;bottom:0;height:64px;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:40}
.bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink2);cursor:pointer;padding:0}
.bottomnav button.on{color:var(--primary)}
.bottomnav svg{width:22px;height:22px}
/* ===== 日期页 ===== */
.datehead{background:var(--surface);flex:none}
.tabrow{display:flex;align-items:center;padding-right:4px}
.tabs{flex:1;display:flex;position:relative;height:48px;min-width:0}
.tab{border:0;background:none;font-size:16px;color:var(--ink2);cursor:pointer;padding:0 13px;white-space:nowrap;position:relative}
.tab.on{color:var(--primary)}
.tabline{position:absolute;bottom:0;height:2.5px;background:var(--primary);border-radius:2px;transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1)}
.morebtn{border:0;background:none;color:var(--ink2);width:40px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.morebtn svg{width:22px;height:22px}
/* ⋯ 弹出菜单 */
.menuwrap{position:absolute;top:96px;right:10px;z-index:70;display:none}
.menuwrap.on{display:block}
.menu{background:var(--surface);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px 0;min-width:172px;animation:mpop .16s ease}
@keyframes mpop{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 16px;font-size:14px;color:var(--ink);cursor:pointer}
.menu button:active{background:var(--surface2)}
.menu svg{width:19px;height:19px;color:var(--ink2)}
.menufix{position:absolute;inset:0;z-index:65;display:none}
.menufix.on{display:block}
/* 内容区 */
.datescroll{flex:1;overflow-y:auto;scrollbar-width:none;position:relative}
.datescroll::-webkit-scrollbar{display:none}
/* 置顶轮播 */
.pinarea{height:122px;overflow:hidden;position:relative}
.pintrack{display:flex;height:100%;will-change:transform}
.pinpage{flex:none;width:100%;padding:6px 16px 0}
.pindots{position:absolute;bottom:2px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.pindots i{width:5px;height:5px;border-radius:3px;background:var(--ink2);opacity:.3;transition:.2s}
.pindots i.on{background:var(--primary);opacity:1;width:12px}
.miniseg{display:flex;background:var(--surface2);border-radius:9px;padding:3px}
.miniseg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:11.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.miniseg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
/* ===== 事件卡片 ===== */
.evwrap{position:relative;margin:0 16px;border-radius:8px;overflow:hidden}
.evwrap+.evwrap{margin-top:8px}
.pane{position:absolute;top:0;bottom:0;display:flex;z-index:0}
.pane.r{right:0}
.pane.l{left:0}
.pact{width:84px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;padding:0}
.pact svg{width:21px;height:21px}
.pact.armed{filter:brightness(1.08)}
.pact .pi{transition:transform .15s}
.pact.armed .pi{transform:scale(1.25)}
/* 松手触发模式的彩色底 */
.triggerlayer{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:13px;font-weight:700;z-index:0;opacity:0}
.triggerlayer svg{width:22px;height:22px}
.card{position:relative;z-index:1;background:var(--surface);border-radius:8px;padding:12px 16px;min-height:64px;display:flex;align-items:center;gap:8px;cursor:pointer;touch-action:pan-y;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card .cicon{flex:none;display:flex}
.card .cicon svg{width:20px;height:20px}
.card .lft{flex:3;min-width:0}
.card .tt{font-size:20px;font-weight:700;line-height:28px;height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:14px;line-height:18px;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.card .rgt{flex:none;display:flex;align-items:baseline;gap:8px;margin-left:16px}
.card .pf{font-size:20px;font-weight:700}
.card .nm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.card .un{font-size:20px;font-weight:700}
.wm{position:absolute;pointer-events:none;opacity:var(--wmop,.15)}
.wm svg{width:64px;height:64px}
.wm.br{right:8px;bottom:4px}.wm.bl{left:8px;bottom:4px}.wm.tr{right:8px;top:4px}.wm.tl{left:8px;top:4px}
.cardwrap-drag{box-shadow:0 12px 32px rgba(0,0,0,.22)!important;z-index:30;position:relative}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:70px 0}
.empty svg{width:52px;height:52px;opacity:.4;display:block;margin:0 auto 14px}
.listend{height:72px}
/* FAB */
#fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.22);transition:transform .15s}
#fab:active{transform:scale(.92)}
#fab svg{width:32px;height:32px}
#fabUndo{position:absolute;left:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:0;background:#F02419;color:#fff;
  display:none;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 3px 10px rgba(240,36,25,.4)}
#fabUndo.on{display:flex}
#fabUndo svg{width:28px;height:28px}
/* snackbar */
.snack{position:absolute;left:16px;right:16px;bottom:16px;background:var(--toastbg);color:var(--toastink);border-radius:8px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;font-size:13.5px;z-index:80;transform:translateY(90px);opacity:0;transition:.25s;pointer-events:none}
.snack.on{transform:none;opacity:1;pointer-events:auto}
.snack .act{margin-left:auto;color:#64B5F6;font-weight:700;border:0;background:none;cursor:pointer;font-size:13.5px;padding:4px}
/* 网格视图 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 0}
.gtile{border-radius:8px;padding:12px 14px;min-height:120px;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.gtile .gt1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtile .gt2{font-size:11px;opacity:.85;margin-top:3px}
.gtile .gt3{margin-top:auto}
.gtile .gn{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gtile .gu{font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
/* ===== 日历 ===== */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
#calTitle{font-size:17px;font-weight:700}
.calnav{border:0;background:none;color:var(--ink2);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:8px}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 12px 0}
.wd{text-align:center;font-size:11.5px;color:var(--ink2);padding:8px 0}
.day{height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;position:relative;border:0;background:none;color:var(--ink);font-family:inherit;padding:0}
.day.out{opacity:.25}
.day.today{box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primaryDeep);font-weight:700}
.day.sel{background:var(--primary);color:#fff;box-shadow:none}
.dots{position:absolute;bottom:5px;display:flex;gap:2.5px}
.dot{width:4px;height:4px;border-radius:2px}
.selhead{font-size:13px;color:var(--ink2);margin:14px 16px 8px}
.selrow{background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:0 16px 8px;font-size:14px;cursor:pointer}
.selrow .sdot{width:10px;height:10px;border-radius:3px;flex:none}
.selrow .sv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
/* ===== 时间页 ===== */
.timehead{background:var(--surface)}
.tp-body{flex:1;overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.tp-body::-webkit-scrollbar{display:none}
.segwrap{display:flex;position:relative;height:48px;background:var(--surface)}
.seg2{flex:1;border:0;background:none;font-size:16px;color:var(--ink2);cursor:pointer;position:relative}
.seg2.on{color:var(--primary)}
.segline{position:absolute;bottom:0;height:2.5px;background:var(--primary);border-radius:2px;transition:left .25s,width .25s}
.cdwrap{position:relative;width:212px;height:212px;margin:22px auto 4px}
.cdcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#cdTime{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.cdsub{font-size:12px;color:var(--ink2);margin-top:6px}
.steps{display:flex;gap:10px;justify-content:center;margin:18px 0 10px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px}
.step .sl{font-size:11px;color:var(--ink2)}
.sbtns{display:flex;align-items:center;gap:6px}
.sbtns button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);font-size:16px;cursor:pointer;font-weight:600}
.sv2{width:46px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap}
.pchip{border:0;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--ink2);cursor:pointer}
.ctrls{display:flex;gap:12px}
.btn2{flex:1;border:0;border-radius:50px;padding:14px 0;font-size:15px;font-weight:700;cursor:pointer}
.btn2.ghost{background:var(--surface2);color:var(--ink)}
.btn2.main{background:var(--primary);color:#fff}
#swTime{text-align:center;font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:34px 0 22px}
.laprow{display:flex;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.laprow .li{color:var(--ink2);width:38px}
.laprow .ll{flex:1;font-weight:600}
.laprow .lt{color:var(--ink2)}
.tagf{background:rgba(76,175,80,.15);color:#2E7D32;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:8px}
.tags{background:rgba(240,36,25,.12);color:#F02419;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:8px}
/* ===== 设置页 ===== */
.sethead{padding:14px 16px 6px;font-size:20px;font-weight:600;background:var(--surface)}
.setbody{flex:1;overflow-y:auto;padding:12px 16px 90px;scrollbar-width:none}
.setbody::-webkit-scrollbar{display:none}
.sitem{background:var(--surface);border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer}
.sitem svg{width:22px;height:22px;color:var(--primary);flex:none}
.sitem .st{flex:1;font-size:15px}
.sitem .chev{color:var(--ink2);opacity:.5}
.sitem .trv{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:13px}
.okdot{width:8px;height:8px;border-radius:4px;background:#4CAF50}
.sbtn{border:0;background:var(--primarySoft);color:var(--primaryDeep);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
/* ===== 滑入式二级页 ===== */
.ov{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column;visibility:hidden}
.ov.on{transform:none;visibility:visible}
.ovhead{height:56px;flex:none;display:flex;align-items:center;padding:0 8px;gap:4px;background:var(--surface)}
.ovhead .ot{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0 -48px 0 0}
.backbtn{border:0;background:none;color:var(--primary);width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.backbtn svg{width:22px;height:22px}
.ovbody{flex:1;overflow-y:auto;padding:14px 16px 30px;scrollbar-width:none}
.ovbody::-webkit-scrollbar{display:none}
/* 详情覆盖层（圆形扩散） */
.detail{position:absolute;inset:0;z-index:60;background:var(--surface);visibility:hidden}
.detail.on{visibility:visible}
.dappbar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 8px;z-index:5}
.dappbar .sp{flex:1}
.pinbtn{border:0;background:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pinbtn svg{width:22px;height:22px}
.dcontent{position:absolute;inset:56px 0 84px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.dicon{margin-bottom:10px}
.dicon svg{width:32px;height:32px}
.dtitle{font-size:28px;font-weight:700;display:flex;align-items:baseline;gap:8px;max-width:100%}
.dtitle .dt1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnum{height:160px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 10px;max-width:100%}
.dfoot{font-size:16px;font-weight:700}
.dacts{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;justify-content:space-evenly;padding:0 8px}
.dact{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:inherit;font-family:inherit;padding:6px 10px;border-radius:8px}
.dact svg{width:24px;height:24px}
.dact span{font-size:12px}
/* 弹层：底部 sheet / 对话框 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:85;opacity:0;visibility:hidden;transition:.22s}
.mask.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:86;padding:10px 0 24px;transform:translateY(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);max-height:78%;overflow-y:auto}
.sheet.on{transform:none}
.shandle{width:32px;height:4px;border-radius:2px;background:var(--ink2);opacity:.25;margin:4px auto 10px}
.stitle{text-align:center;font-size:15px;font-weight:700;padding:2px 0 8px}
.srow{display:flex;align-items:center;gap:14px;padding:13px 20px;font-size:14.5px;cursor:pointer}
.srow svg{width:20px;height:20px;color:var(--ink2)}
.srow.on{color:var(--primary);font-weight:600}
.srow.on svg{color:var(--primary)}
.srow .chk{margin-left:auto;visibility:hidden;color:var(--primary)}
.srow.on .chk{visibility:visible}
.sdiv{height:1px;background:var(--line);margin:6px 0}
.slabel{font-size:12.5px;color:var(--ink2);padding:8px 20px 6px}
.catwrap{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 6px}
.cat{border:0;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.cat.on{outline:2px solid var(--primary);outline-offset:1px}
.dialog{position:absolute;left:40px;right:40px;top:50%;transform:translateY(-50%) scale(.95);background:var(--surface);border-radius:16px;z-index:86;padding:8px 0;opacity:0;visibility:hidden;transition:.18s;max-height:70%;overflow-y:auto}
.dialog.on{opacity:1;visibility:visible;transform:translateY(-50%) scale(1)}
.dlgtitle{text-align:center;font-size:15px;font-weight:700;padding:10px 0 6px}
/* 编辑页表单 */
.field{margin:16px 0}
.fl{font-size:12.5px;color:var(--ink2);margin-bottom:8px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14.5px;color:var(--ink);background:var(--surface);outline:none;font-family:inherit}
.inp:focus{border-color:var(--primary)}
.inprow{display:flex;gap:10px}
.inprow .field{flex:1}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--primarySoft);color:var(--primaryDeep);font-weight:600}
.srow2{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14.5px}
.sw2{width:44px;height:26px;border-radius:13px;background:var(--surface3);position:relative;cursor:pointer;border:0;transition:background .18s;flex:none}
.sw2 i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw2.on{background:var(--primary)}
.sw2.on i{left:21px}
.swgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.sw{aspect-ratio:1;border-radius:8px;cursor:pointer;border:0;padding:0;outline:2px solid transparent;outline-offset:2px}
.sw.on{outline-color:var(--primary)}
.swadd{background:var(--surface2);color:var(--ink2);font-size:18px;display:flex;align-items:center;justify-content:center}
.customrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.customrow input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.tabs4{display:flex;background:var(--surface);position:relative;height:44px}
.tabs4 button{flex:1;border:0;background:none;font-size:13.5px;color:var(--ink2);cursor:pointer}
.tabs4 button.on{color:var(--primary);font-weight:600}
.preview{border-radius:8px;padding:12px 16px;min-height:64px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.preview .lft{flex:3;min-width:0}
.preview .tt{font-size:20px;font-weight:700;line-height:28px}
.preview .dt{font-size:14px;line-height:18px;opacity:.95}
.preview .rgt{display:flex;align-items:baseline;gap:8px;margin-left:16px}
.savebtn{border:0;background:var(--primary);color:#fff;border-radius:10px;padding:7px 16px;font-size:13.5px;font-weight:700;cursor:pointer;margin-right:8px}
/* 编辑页分块表单（对照原版 add_event_page） */
.fcard{background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:12px;padding:15px 16px;min-height:24px;cursor:pointer;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow:active{background:var(--surface2)}
.fic{flex:none;display:flex;color:var(--primary)}

          l.style.left=dir>0?'0':'';l.style.right=dir<0?'0':'';}
        else{l.style.opacity=0;l.style.width='0px';}});}
    else{card.style.transform=`translateX(${Math.min(0,Math.max(dx,-252))}px)`;}});
  const up=()=>{if(!drag)return;drag=false;card.style.transition='transform .25s';
    if(S.swipeMode==='trigger'&&Math.abs(dx)>=52){toast('已触发（演示）');}
    card.style.transform='';
    wrap.querySelectorAll('.triggerlayer').forEach(l=>{l.style.opacity=0;l.style.width='0px';});};
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('pointerleave',()=>{if(drag)up();});
  $('#demoPlay').onclick=()=>{const t0=performance.now();
    if(S.swipeMode==='trigger'){
      const step=t=>{const p=Math.min(1,(t-t0)/800);const e=1-Math.pow(1-p,3);
        const x=-170*e;card.style.transform=`translateX(${x}px)`;
        const l=wrap.querySelector('.triggerlayer[data-act=del]');
        l.style.width='208px';l.style.opacity=0.45+e*0.55;l.style.right='0';l.style.left='';
        if(p<1)requestAnimationFrame(step);
        else setTimeout(()=>{card.style.transform='';l.style.opacity=0;l.style.width='0px';toast('已触发「删除」（演示）');},450);};
      requestAnimationFrame(step);}
    else{
      const step=t=>{const p=Math.min(1,(t-t0)/500);const e=1-Math.pow(1-p,3);
        card.style.transform=`translateX(${-252*e}px)`;
        if(p<1)requestAnimationFrame(step);
        else setTimeout(()=>{card.style.transition='transform .3s';card.style.transform='';toast('点右侧按钮执行（演示）');},600);};
      card.style.transition='none';requestAnimationFrame(step);}};}

function openWmPage(){$('#subTitle').textContent='卡片水印';
  const posNames={br:'右下',bl:'左下',tr:'右上',tl:'左上'};
  const opNames={low:'淡',mid:'中',high:'明显'};
  $('#subBody').innerHTML=`
    <div class="srow2"><span>显示水印</span><button class="sw2 ${S.wm.on?'on':''}" id="wmOn"><i></i></button></div>
    <div class="sitem"><span class="st">水印位置</span><span class="miniseg" id="wmPosSeg">${['br','bl','tr','tl'].map(p=>`<button data-v="${p}" class="${S.wm.pos===p?'on':''}">${posNames[p]}</button>`).join('')}</span></div>
    <div class="sitem"><span class="st">水印透明度</span><span class="miniseg" id="wmOpSeg">${['low','mid','high'].map(o=>`<button data-v="${o}" class="${S.wm.op===o?'on':''}">${opNames[o]}</button>`).join('')}</span></div>
    <div class="slabel">示例（改动即时生效）</div>
    ${demoCardHTML(true)}`;
  $('#wmOn').onclick=()=>{S.wm.on=!S.wm.on;$('#wmOn').classList.toggle('on',S.wm.on);renderList();renderPinned();renderSettings();};
  $('#wmPosSeg').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;S.wm.pos=b.dataset.v;renderList();renderPinned();openWmPage();};
  $('#wmOpSeg').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;S.wm.op=b.dataset.v;renderList();renderPinned();openWmPage();};}

function openSub(title,rows,sel,onPick){$('#subTitle').textContent=title;
  $('#subBody').innerHTML=rows.map(r=>{const[k,t]=r.split('|');
    return`<div class="sitem" data-k="${k}"><span class="st">${t}</span>${sel===k?'<span style="color:var(--primary);font-weight:700">✓</span>':'<span class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>'}</div>`;}).join('');
  $('#subBody').onclick=e=>{const r=e.target.closest('.sitem[data-k]');if(!r)return;onPick(r.dataset.k);};
  $('#ov-sub').classList.add('on');}
$('#subBack').addEventListener('click',()=>$('#ov-sub').classList.remove('on'));
function openNoti(){$('#subTitle').textContent='通知';
  $('#subBody').innerHTML=`
    <div class="sitem"><span class="st">通知权限</span><span class="trv"><span class="okdot"></span>已开启</span></div>
    <div class="sitem" id="t1"><span class="st">测试通知（即时）</span></div>
    <div class="sitem" id="t2"><span class="st">测试通知（延迟 10 秒）</span></div>`;
  $('#t1').onclick=()=>toast('🔔 测试通知已发送（原型模拟）');
  $('#t2').onclick=()=>{toast('已安排，10 秒后提醒');setTimeout(()=>toast('⏰ 延迟测试通知（原型模拟）'),10000);};
  $('#ov-sub').classList.add('on');}
/* ================= 主题 / 导航 ================= */
let theme='light';
function setTheme(v){theme=v;
  const sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.dataset.theme=v==='system'?(sysDark?'dark':'light'):v;}
function switchTab(t){S.tab=t;
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='scr-'+t));
  $$('#bnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='date'){moveLine();renderList();}
  if(t==='time')moveSeg();
  if(t==='settings')renderSettings();}
$('#bnav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchTab(b.dataset.t);});
$('#fab').addEventListener('click',()=>openNew(null));
/* ================= 初始化 ================= */
bindSwipe();
const toks=location.hash.replace('#','').split('-').filter(Boolean);
if(toks.includes('dark'))setTheme('dark');
switchTab(toks.includes('time')?'time':toks.includes('settings')?'settings':'date');
renderList();renderPinned();cdShow();swShow();moveLine();moveSeg();
window.__protoReady=true;
window.addEventListener('load',()=>{moveLine();moveSeg();});
</script>
